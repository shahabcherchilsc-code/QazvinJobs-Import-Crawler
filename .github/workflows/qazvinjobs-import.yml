      QZIH_MAX_CANDIDATES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_candidates || '300' }}

      QZIH_MAX_ACCEPT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_accept || '50' }}

      QZIH_MAX_REVIEW: "5"

      QZIH_MAX_AGE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_age_days || '2' }}

      QZIH_RUN_LIMIT_MINUTES: "43"

    steps:

      - name: Checkout repository
