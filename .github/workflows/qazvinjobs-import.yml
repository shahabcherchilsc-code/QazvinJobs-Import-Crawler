name: QazvinJobs Daily Import

on:
  workflow_dispatch:

  schedule:
    # اجرای اصلی روزانه - ساعت 09:17 به وقت ایران
    - cron: '17 9 * * *'
      timezone: 'Asia/Tehran'

    # اجرای پشتیبان روزانه - ساعت 19:37 به وقت ایران
    - cron: '37 19 * * *'
      timezone: 'Asia/Tehran'

concurrency:
  group: qazvinjobs-daily-crawler
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl E-Estekhdam + Divar
    runs-on: ubuntu-latest

    # چون اجرای فعلی حدود 40 دقیقه طول کشیده،
    # برای اطمینان تا 60 دقیقه فرصت می‌دهیم.
    timeout-minutes: 60

    env:
      # ساعت داخلی Node / Log ها
      TZ: Asia/Tehran

      # اتصال به Import Hub سایت
      QZIH_IMPORT_ENDPOINT: ${{ secrets.QZIH_IMPORT_ENDPOINT }}
      QZIH_IMPORT_TOKEN: ${{ secrets.QZIH_IMPORT_TOKEN }}

      # اتصال حساب دیوار
      QZIH_DIVAR_LOGIN_PHONE: ${{ secrets.QZIH_DIVAR_LOGIN_PHONE }}

      # هر دو منبع
      QZIH_SOURCES: both

      # تعداد صفحات قابل بررسی
      QZIH_MAX_PAGES: '20'

      # حداکثر کاندید از هر منبع
      QZIH_MAX_CANDIDATES: '500'

      # حداکثر موارد قابل پذیرش در هر اجرا
      QZIH_MAX_ACCEPT: '200'

      # تعداد مواردی که در صورت نیاز
      # برای بررسی دستی مدیر نگه داشته می‌شوند
      QZIH_MAX_REVIEW: '5'

      # حداکثر زمان فعالیت خود Crawler
      QZIH_RUN_LIMIT_MINUTES: '50'

      # فقط آگهی‌های حداکثر 7 روز اخیر منبع
      QZIH_MAX_AGE_DAYS: '7'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install crawler dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Validate required settings
        shell: bash
        run: |
          if [ -z "$QZIH_IMPORT_ENDPOINT" ]; then
            echo "ERROR: QZIH_IMPORT_ENDPOINT is missing"
            exit 1
          fi

          if [ -z "$QZIH_IMPORT_TOKEN" ]; then
            echo "ERROR: QZIH_IMPORT_TOKEN is missing"
            exit 1
          fi

          echo "Import Hub settings are available."

          if [ -n "$QZIH_DIVAR_LOGIN_PHONE" ]; then
            echo "Divar login phone is configured."
          else
            echo "WARNING: QZIH_DIVAR_LOGIN_PHONE is empty."
          fi

      - name: Run QazvinJobs crawler
        run: npm run crawl

      - name: Upload diagnostics if crawler fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qazvinjobs-crawler-diagnostics-${{ github.run_id }}
          path: |
            *.png
            *.json
            logs/**
          if-no-files-found: ignore
          retention-days: 7
