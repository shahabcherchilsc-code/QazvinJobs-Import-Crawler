      QZIH_IMPORT_ENDPOINT: ${{ secrets.QZIH_IMPORT_ENDPOINT }}
      QZIH_IMPORT_TOKEN: ${{ secrets.QZIH_IMPORT_TOKEN }}
      QZIH_DIVAR_LOGIN_PHONE: ${{ secrets.QZIH_DIVAR_LOGIN_PHONE }}

      QZIH_SOURCES: divar

      QZIH_SEED_URLS: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_url || '' }}

      QZIH_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_pages || '12' }}

      QZIH_MAX_CANDIDATES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_candidates || '300' }}

      QZIH_MAX_ACCEPT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_accept || '50' }}

      QZIH_MAX_REVIEW: "5"

      QZIH_MAX_AGE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_age_days || '2' }}

      QZIH_RUN_LIMIT_MINUTES: "43"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Locate crawler ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f "${PREFERRED_SOURCE_ZIP}" ]; then

            echo "SOURCE_ZIP=${PREFERRED_SOURCE_ZIP}" >> "$GITHUB_ENV"

            echo "Using preferred ZIP:"
            ls -lh "${PREFERRED_SOURCE_ZIP}"

            exit 0
          fi

          mapfile -t MATCHES < <(
            find . \
              -maxdepth 1 \
              -type f \
              -name 'QazvinJobs-Import-Crawler-*.zip' \
              -printf '%f\n'
          )

          if [ "${#MATCHES[@]}" -eq 1 ]; then

            echo "SOURCE_ZIP=${MATCHES[0]}" >> "$GITHUB_ENV"

            echo "Using crawler ZIP:"
            echo "${MATCHES[0]}"

            exit 0
          fi

          echo "ERROR: Unable to safely select crawler ZIP."

          printf '%s\n' "${MATCHES[@]:-none}"

          exit 1


      - name: Create project folder
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "${PROJECT_DIR}"
