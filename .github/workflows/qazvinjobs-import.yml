name: QazvinJobs Import Crawler

on:
  schedule:
    - cron: "30 5 * * *"

  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to crawl"
        required: true
        default: "both"

      max_age_days:
        description: "Maximum ad age in days"
        required: true
        default: "7"

      max_pages:
        description: "Maximum search pages"
        required: true
        default: "20"

      max_candidates:
        description: "Maximum candidates"
        required: true
        default: "500"

      max_accepted:
        description: "Maximum accepted drafts"
        required: true
        default: "50"


jobs:
  crawl:

    runs-on: ubuntu-latest

    env:
      QZIH_SOURCES: ${{ github.event.inputs.sources || 'both' }}
      QZIH_MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '7' }}
      QZIH_MAX_PAGES: ${{ github.event.inputs.max_pages || '20' }}
      QZIH_MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '500' }}
      QZIH_MAX_ACCEPTED: ${{ github.event.inputs.max_accepted || '50' }}


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Check source ZIP
        run: |
          ls -la


      - name: Create project folder
        run: |
          mkdir -p qzih-crawler


      - name: Extract crawler
        run: |
          unzip -o QazvinJobs-Import-Crawler-*.zip -d qzih-crawler


      - name: Show extracted files
        run: |
          find qzih-crawler -maxdepth 2 -type f


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Install dependencies
        working-directory: qzih-crawler
        run: |
          npm install


      - name: Install Playwright
        working-directory: qzih-crawler
        run: |
          npx playwright install chromium


      - name: Run crawler
        working-directory: qzih-crawler
        env:
          QZIH_WP_URL: ${{ secrets.QZIH_WP_URL }}
          QZIH_WP_TOKEN: ${{ secrets.QZIH_WP_TOKEN }}

          QZIH_DIVAR_LOGIN_PHONE: ${{ secrets.QZIH_DIVAR_LOGIN_PHONE }}
          QZIH_DIVAR_LOGIN_SECRET: ${{ secrets.QZIH_DIVAR_LOGIN_SECRET }}

        run: |
          node crawler.mjs


      - name: Create summary
        if: always()
        run: |
          echo "Crawler finished"
          echo "Sources: $QZIH_SOURCES"
          echo "Max age: $QZIH_MAX_AGE_DAYS days"
          echo "Max pages: $QZIH_MAX_PAGES"
          echo "Max candidates: $QZIH_MAX_CANDIDATES"
          echo "Max accepted: $QZIH_MAX_ACCEPTED"


      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-diagnostics
          path: |
            qzih-crawler/*.json
            qzih-crawler/logs/**
          if-no-files-found: ignore
