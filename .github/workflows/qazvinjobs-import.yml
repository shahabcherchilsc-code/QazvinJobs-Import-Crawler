name: QazvinJobs Daily Import

on:
  workflow_dispatch:
    inputs:
      max_accept:
        description: 'حداکثر پیش‌نویس در اجرای دستی؛ اجرای اول ۱۰ مورد'
        required: true
        default: '10'
        type: string

  schedule:
    # اجرای اصلی روزانه - ساعت 09:17 به وقت ایران
    - cron: '17 9 * * *'
      timezone: 'Asia/Tehran'

concurrency:
  group: qazvinjobs-daily-crawler
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl E-Estekhdam + Divar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Asia/Tehran

      # اتصال به سایت و Import Hub
      QZIH_SITE_URL: ${{ secrets.QZIH_SITE_URL }}
      QZIH_IMPORT_ENDPOINT: ${{ secrets.QZIH_IMPORT_ENDPOINT }}
      QZIH_IMPORT_TOKEN: ${{ secrets.QZIH_IMPORT_TOKEN }}

      # شماره حساب متصل دیوار
      QZIH_DIVAR_LOGIN_PHONE: ${{ secrets.QZIH_DIVAR_LOGIN_PHONE }}

      # هر دو منبع
      QZIH_SOURCES: both

      # تعداد صفحات قابل بررسی
      QZIH_MAX_PAGES: '20'

      # حداکثر کاندیدهای قابل بررسی
      QZIH_MAX_CANDIDATES: '500'

      # حداکثر آگهی قابل قبول در هر اجرا
      QZIH_MAX_ACCEPT: ${{ inputs.max_accept || '200' }}

      # موارد نیازمند بررسی دستی
      QZIH_MAX_REVIEW: '5'

      # حداکثر زمان کار خود خزنده
      QZIH_RUN_LIMIT_MINUTES: '50'

      # فقط آگهی‌های ۲۴ ساعت اخیر که قبلاً وارد نشده‌اند
      QZIH_MAX_AGE_DAYS: '1'
      QZIH_IMPORT_HISTORY_FILE: ${{ github.workspace }}/.qazvinjobs-import-state/history.json
      QZIH_REQUIRE_KNOWN_AGE: '1'
      QZIH_ALLOW_CONTACT_REVIEW: '0'
      # اجرای روزانه نباید روی آگهیِ تستِ باقی‌مانده در وردپرس قفل شود
      QZIH_ENABLE_CONTROLLED_TEST: '0'
      QZIH_CRAWLER_PACKAGE: 'QazvinJobs-Import-Crawler-0.6.7-DAILY-NEW-FIELD-FIX.zip'

    steps:

      # -----------------------------------------
      # 1. دریافت فایل‌های Repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # 2. بازیابی سابقه شناسه‌ها و استخراج نسخه مشخص خزنده
      # -----------------------------------------
      - name: Restore imported source IDs
        id: import_history
        uses: actions/cache/restore@v4
        with:
          path: .qazvinjobs-import-state/history.json
          key: qazvinjobs-import-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            qazvinjobs-import-history-v1-
          fail-on-cache-miss: false

      - name: Extract crawler package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Looking for latest QazvinJobs Crawler..."
          echo "========================================"

          ZIP_FILE="$(
            find . \
              -maxdepth 3 \
              -type f \
              -name "$QZIH_CRAWLER_PACKAGE" \
              -print |
            sort -V |
            tail -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No QazvinJobs Import Crawler ZIP found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Selected crawler package:"
          echo "$ZIP_FILE"

          RUNTIME_DIR="$GITHUB_WORKSPACE/.crawler-runtime"

          rm -rf "$RUNTIME_DIR"
          mkdir -p "$RUNTIME_DIR"

          unzip -q "$ZIP_FILE" -d "$RUNTIME_DIR"

          echo ""
          echo "Extracted files:"
          find "$RUNTIME_DIR" -maxdepth 5 -type f | sort

          echo ""
          echo "Looking for crawler.mjs..."

          CRAWLER_FILE="$(
            find "$RUNTIME_DIR" \
              -maxdepth 6 \
              -type f \
              -name 'crawler.mjs' |
            head -n 1
          )"

          if [ -z "$CRAWLER_FILE" ]; then
            echo "ERROR: crawler.mjs was not found after extracting ZIP."
            exit 1
          fi

          CRAWLER_DIR="$(dirname "$CRAWLER_FILE")"

          if [ ! -f "$CRAWLER_DIR/package.json" ]; then
            echo "ERROR: package.json was not found beside crawler.mjs."
            echo ""
            echo "Crawler directory:"
            echo "$CRAWLER_DIR"
            echo ""
            ls -la "$CRAWLER_DIR"
            exit 1
          fi

          echo ""
          echo "Crawler directory detected:"
          echo "$CRAWLER_DIR"

          echo "CRAWLER_DIR=$CRAWLER_DIR" >> "$GITHUB_ENV"

      # -----------------------------------------
      # 3. Node.js
      # -----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -----------------------------------------
      # 4. نصب Dependency های Crawler
      # -----------------------------------------
      - name: Install crawler dependencies
        shell: bash
        run: |
          set -e

          cd "$CRAWLER_DIR"

          echo "Installing crawler dependencies..."

          npm install \
            --no-audit \
            --no-fund

      # -----------------------------------------
      # 5. نصب Chromium مورد نیاز Playwright
      # -----------------------------------------
      - name: Install Chromium for Playwright
        shell: bash
        run: |
          set -e

          cd "$CRAWLER_DIR"

          npx playwright install --with-deps chromium

      # -----------------------------------------
      # 6. بررسی تنظیمات ضروری
      # -----------------------------------------
      - name: Validate required settings
        shell: bash
        run: |
          set -e

          echo "Checking Import Hub configuration..."

          if [ -z "$QZIH_IMPORT_ENDPOINT" ]; then
            echo "ERROR: QZIH_IMPORT_ENDPOINT is missing."
            exit 1
          fi

          if [ -z "$QZIH_IMPORT_TOKEN" ]; then
            echo "ERROR: QZIH_IMPORT_TOKEN is missing."
            exit 1
          fi

          if [ -z "$QZIH_SITE_URL" ]; then
            echo "WARNING: QZIH_SITE_URL is empty."
          else
            echo "Site URL: configured"
          fi

          echo "Import endpoint: configured"
          echo "Import token: configured"

          if [ -n "$QZIH_DIVAR_LOGIN_PHONE" ]; then
            echo "Divar login phone: configured"
          else
            echo "WARNING: QZIH_DIVAR_LOGIN_PHONE is empty."
          fi

      # -----------------------------------------
      # 7. نمایش نسخه Crawler
      # -----------------------------------------
      - name: Show crawler version
        shell: bash
        run: |
          set -e

          cd "$CRAWLER_DIR"

          echo "========================================"
          echo "Crawler package selected:"
          echo "$CRAWLER_DIR"
          echo "========================================"

          node -p '"Crawler version: " + JSON.parse(require("fs").readFileSync("package.json", "utf8")).version'

      - name: Test parser before importing
        shell: bash
        run: |
          set -euo pipefail
          cd "$CRAWLER_DIR"
          npm test

      # -----------------------------------------
      # 8. اجرای اصلی Crawler
      # -----------------------------------------
      - name: Run QazvinJobs crawler
        shell: bash
        run: |
          set -e

          cd "$CRAWLER_DIR"

          echo "========================================"
          echo "Starting QazvinJobs crawler"
          echo "Sources: E-Estekhdam + Divar"
          echo "Max age: $QZIH_MAX_AGE_DAYS days; direct contact required"
          echo "========================================"

          set -o pipefail
          npm run crawl 2>&1 | tee run.log

      - name: Save imported source IDs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .qazvinjobs-import-state/history.json
          key: qazvinjobs-import-history-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # -----------------------------------------
      # 9. ذخیره گزارش اجرا حتی در صورت موفقیت
      # -----------------------------------------
      - name: Upload crawl run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qazvinjobs-crawler-diagnostics-${{ github.run_id }}
          path: |
            .crawler-runtime/**/run.log
            .crawler-runtime/**/run-summary.json
          if-no-files-found: ignore
          retention-days: 7
