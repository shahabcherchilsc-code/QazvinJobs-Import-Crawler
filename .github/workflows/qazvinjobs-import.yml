name: QazvinJobs Receiver Tests
on:
  workflow_dispatch:
    inputs:
      check_live_receiver:
        description: فقط بعد از نصب نسخهٔ جدید؛ بررسی اتصال و قفل گیرنده بدون واردکردن آگهی
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: qazvinjobs-receiver-tests
  cancel-in-progress: false
jobs:
  receiver-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: qj_test_only
          MYSQL_DATABASE: qj_ci
          MYSQL_USER: qj_ci
          MYSQL_PASSWORD: qj_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pqj_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact receiver candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          package = Path('QazvinJobs-Import-Hub-0.3.59-IDENTITY-GUARD.zip')
          with zipfile.ZipFile(package) as archive:
              for info in archive.infolist():
                  path = Path(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise RuntimeError('Invalid package path')
              archive.extractall('.receiver-test')
          PY
      - name: PHP syntax and existing receiver regressions
        shell: bash
        run: |
          set -euo pipefail
          php -v
          find .receiver-test/qazvinjobs-import-hub -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php .receiver-test/qazvinjobs-import-hub/tests/importer-regressions.php
      - name: Source identity and repeat-import regressions
        shell: bash
        run: |
          set -euo pipefail
          php .receiver-test/qazvinjobs-import-hub/tests/identity-regressions.php
      - name: Real database concurrency and nested locks
        shell: bash
        run: |
          set -euo pipefail
          php .receiver-test/qazvinjobs-import-hub/tests/mysql-locks.php
      - name: Check installed receiver (GET only, no imports)
        if: ${{ inputs.check_live_receiver }}
        env:
          QZIH_IMPORT_ENDPOINT: ${{ secrets.QZIH_IMPORT_ENDPOINT }}
          QZIH_IMPORT_TOKEN: ${{ secrets.QZIH_IMPORT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          endpoint = os.environ.get('QZIH_IMPORT_ENDPOINT', '').rstrip('/')
          token = os.environ.get('QZIH_IMPORT_TOKEN', '')
          parsed = urllib.parse.urlparse(endpoint)
          if parsed.scheme != 'https' or not endpoint.endswith('/batch') or parsed.query or parsed.fragment or not token:
              raise RuntimeError('Receiver endpoint/token configuration is incomplete')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  raise RuntimeError('Receiver redirect refused; check the configured HTTPS endpoint')
          request = urllib.request.Request(endpoint[:-6] + '/status', headers={'X-Qzih-Token':token}, method='GET')
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=20) as response:
                  data = json.load(response)
          except Exception:
              raise RuntimeError('Receiver status could not be verified; no import was requested') from None
          if data.get('version') != '0.3.59' or data.get('identity_guard') != 'page-lock-v1' or data.get('identity_lock_ready') is not True:
              raise RuntimeError('New receiver version or database lock is not ready; keep production imports disabled')
          print('Receiver 0.3.59 and its database lock verified. GET only; no draft imported.')
          PY
