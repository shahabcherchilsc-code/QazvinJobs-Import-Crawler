name: QazvinJobs Import Crawler

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to crawl"
        required: true
        default: "both"

      seed_url:
        description: "Optional seed URL"
        required: false
        default: ""

      max_pages:
        description: "Maximum search pages"
        required: true
        default: "20"

      max_candidates:
        description: "Maximum candidates"
        required: true
        default: "500"

      max_accept:
        description: "Maximum accepted drafts"
        required: true
        default: "50"

      max_age_days:
        description: "Maximum age in days"
        required: true
        default: "2"


jobs:

  crawler:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Check source ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(ls *.zip | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No crawler zip found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"


      - name: Extract crawler
        shell: bash
        run: |

          set -e

          mkdir -p crawler

          ZIP=$(ls *.zip | head -n 1)

          unzip -o "$ZIP" -d crawler

          echo "Extract completed"


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Install dependencies
        working-directory: crawler
        run: |

          npm install


      - name: Install Playwright
        working-directory: crawler
        run: |

          npx playwright install chromium


      - name: Run crawler
        working-directory: crawler
        env:

          SOURCE:
            ${{ github.event.inputs.source }}

          SEED_URL:
            ${{ github.event.inputs.seed_url }}

          MAX_PAGES:
            ${{ github.event.inputs.max_pages }}

          MAX_CANDIDATES:
            ${{ github.event.inputs.max_candidates }}

          MAX_ACCEPT:
            ${{ github.event.inputs.max_accept }}

          MAX_AGE_DAYS:
            ${{ github.event.inputs.max_age_days }}

        run: |

          node index.js


      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: crawler-diagnostics

          path: |

            crawler/**/*.json
            crawler/**/*.log

          if-no-files-found: ignore
