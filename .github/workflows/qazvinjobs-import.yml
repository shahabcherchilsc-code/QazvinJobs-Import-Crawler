name: QazvinJobs Daily Import

on:
  workflow_dispatch:

  schedule:
    - cron: '17 9 * * *'
      timezone: 'Asia/Tehran'

    - cron: '37 19 * * *'
      timezone: 'Asia/Tehran'

concurrency:
  group: qazvinjobs-daily-crawler
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl E-Estekhdam + Divar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Asia/Tehran

      QZIH_SITE_URL: ${{ secrets.QZIH_SITE_URL }}
      QZIH_IMPORT_ENDPOINT: ${{ secrets.QZIH_IMPORT_ENDPOINT }}
      QZIH_IMPORT_TOKEN: ${{ secrets.QZIH_IMPORT_TOKEN }}
      QZIH_DIVAR_LOGIN_PHONE: ${{ secrets.QZIH_DIVAR_LOGIN_PHONE }}

      QZIH_SOURCES: both
      QZIH_MAX_PAGES: '20'
      QZIH_MAX_CANDIDATES: '500'
      QZIH_MAX_ACCEPT: '200'
      QZIH_MAX_REVIEW: '5'
      QZIH_RUN_LIMIT_MINUTES: '50'
      QZIH_MAX_AGE_DAYS: '7'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find crawler directory
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort | head -200

          CRAWLER_FILE="$(find . -maxdepth 5 -type f -name 'crawler.mjs' | head -n 1)"

          if [ -z "$CRAWLER_FILE" ]; then
            echo "ERROR: crawler.mjs was not found in repository."
            exit 1
          fi

          CRAWLER_DIR="$(dirname "$CRAWLER_FILE")"

          if [ ! -f "$CRAWLER_DIR/package.json" ]; then
            echo "ERROR: package.json was not found beside crawler.mjs"
            echo "Crawler directory: $CRAWLER_DIR"
            ls -la "$CRAWLER_DIR"
            exit 1
          fi

          echo "Crawler found in: $CRAWLER_DIR"
          echo "CRAWLER_DIR=$CRAWLER_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install crawler dependencies
        shell: bash
        run: |
          cd "$CRAWLER_DIR"
          npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        shell: bash
        run: |
          cd "$CRAWLER_DIR"
          npx playwright install --with-deps chromium

      - name: Validate required settings
        shell: bash
        run: |
          if [ -z "$QZIH_IMPORT_ENDPOINT" ]; then
            echo "ERROR: QZIH_IMPORT_ENDPOINT is missing"
            exit 1
          fi

          if [ -z "$QZIH_IMPORT_TOKEN" ]; then
            echo "ERROR: QZIH_IMPORT_TOKEN is missing"
            exit 1
          fi

          echo "Import Hub configuration OK."

          if [ -n "$QZIH_DIVAR_LOGIN_PHONE" ]; then
            echo "Divar login phone configured."
          else
            echo "WARNING: QZIH_DIVAR_LOGIN_PHONE is empty."
          fi

      - name: Run QazvinJobs crawler
        shell: bash
        run: |
          cd "$CRAWLER_DIR"
          npm run crawl

      - name: Upload diagnostics if crawler fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qazvinjobs-crawler-diagnostics-${{ github.run_id }}
          path: |
            **/*.png
            **/*.json
            **/logs/**
          if-no-files-found: ignore
          retention-days: 7
