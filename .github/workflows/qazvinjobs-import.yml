name: QazvinJobs Import Crawler

on:
  schedule:
    - cron: "30 5 * * *"   # هر روز ساعت 9 صبح ایران
  workflow_dispatch:
    inputs:
      source:
        description: "Source to crawl"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - e-estekhdam
          - divar
      seed_url:
        description: "Optional seed URL"
        required: false
        default: ""
      max_pages:
        description: "Maximum search pages"
        required: true
        default: "20"
      max_candidates:
        description: "Maximum candidates"
        required: true
        default: "500"
      max_drafts:
        description: "Maximum accepted drafts"
        required: true
        default: "50"
      max_age_days:
        description: "Maximum ad age in days"
        required: true
        default: "2"

jobs:
  crawl:
    runs-on: ubuntu-latest

    env:
      SOURCE_TO_CRAWL: ${{ github.event.inputs.source || 'both' }}
      SEED_URL: ${{ github.event.inputs.seed_url || '' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '20' }}
      MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '500' }}
      MAX_DRAFTS: ${{ github.event.inputs.max_drafts || '50' }}
      MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '2' }}

      SOURCE_ZIP: QazvinJobs-Import-Crawler-0.6.2-RECENT-FIRST-STRICT-DIVAR.zip
      HUB_ZIP: QazvinJobs-Import-Hub-0.3.55-STRICT-DIVAR-JOB-ONLY.zip

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Check source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected crawler ZIP:"
          echo "$SOURCE_ZIP"

          test -f "$SOURCE_ZIP" || {
            echo "ERROR: crawler zip not found"
            ls -la
            exit 1
          }


      - name: Create project folder
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="qazvinjobs-import-crawler"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV


      - name: Extract crawler
        shell: bash
        run: |
          set -euo pipefail

          unzip -o "$SOURCE_ZIP" -d "$PROJECT_DIR"

          find "$PROJECT_DIR" -maxdepth 2 -type f | head -50


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Install dependencies
        working-directory: qazvinjobs-import-crawler
        shell: bash
        run: |
          npm install


      - name: Install Playwright
        working-directory: qazvinjobs-import-crawler
        shell: bash
        run: |
          npx playwright install chromium


      - name: Run crawler
        working-directory: qazvinjobs-import-crawler
        shell: bash
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_TOKEN: ${{ secrets.WORDPRESS_TOKEN }}
        run: |

          node index.js \
          --source "$SOURCE_TO_CRAWL" \
          --seed "$SEED_URL" \
          --pages "$MAX_PAGES" \
          --candidates "$MAX_CANDIDATES" \
          --drafts "$MAX_DRAFTS" \
          --age-days "$MAX_AGE_DAYS"


      - name: Create summary
        if: always()
        shell: bash
        run: |
          echo "## QazvinJobs Import Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Source: $SOURCE_TO_CRAWL" >> $GITHUB_STEP_SUMMARY
          echo "Max age: $MAX_AGE_DAYS days" >> $GITHUB_STEP_SUMMARY
          echo "Candidates: $MAX_CANDIDATES" >> $GITHUB_STEP_SUMMARY


      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-diagnostics
          path: |
            qazvinjobs-import-crawler/*.json
            qazvinjobs-import-crawler/logs/
          if-no-files-found: ignore
