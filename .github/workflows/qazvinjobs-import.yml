
name: QazvinJobs Daily Import

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Run tests only without importing jobs'
        required: false
        default: false
        type: boolean

      connect_divar:
        description: 'Reconnect Divar account using WordPress OTP'
        required: false
        default: false
        type: boolean

      source_url:
        description: 'Optional single job URL'
        required: false
        default: ''
        type: string

      max_accept:
        description: 'Maximum accepted jobs for manual run'
        required: true
        default: '10'
        type: string

  schedule:
    - cron: '17 9 * * *'
      timezone: 'Asia/Tehran'

concurrency:
  group: qazvinjobs-daily-crawler
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl E-Estekhdam + Divar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Asia/Tehran

      QZIH_SITE_URL: ${{ secrets.QZIH_SITE_URL }}
      QZIH_IMPORT_ENDPOINT: ${{ secrets.QZIH_IMPORT_ENDPOINT }}
      QZIH_IMPORT_TOKEN: ${{ secrets.QZIH_IMPORT_TOKEN }}
      QZIH_DIVAR_LOGIN_PHONE: ${{ secrets.QZIH_DIVAR_LOGIN_PHONE }}

      QZIH_SOURCES: both
      QZIH_SEED_URLS: ${{ inputs.source_url || '' }}

      QZIH_MAX_PAGES: '20'
      QZIH_MAX_CANDIDATES: '500'
      QZIH_MAX_ACCEPT: ${{ inputs.max_accept || '200' }}
      QZIH_MAX_REVIEW: '5'
      QZIH_RUN_LIMIT_MINUTES: '50'

      QZIH_MAX_AGE_DAYS: '1'
      QZIH_FRESHNESS_MODE: today_yesterday
      QZIH_IMPORT_HISTORY_FILE: ${{ github.workspace }}/.qazvinjobs-import-state/history.json
      QZIH_REQUIRE_KNOWN_AGE: '1'
      QZIH_ALLOW_CONTACT_REVIEW: '0'
      QZIH_ENABLE_CONTROLLED_TEST: '0'

      # Exact ZIP filename currently uploaded to GitHub
      QZIH_CRAWLER_PACKAGE: 'QazvinJobs-Import-Crawler-0.6.10-CALENDAR-DIVAR-RECOVERY-2.zip'

    steps:

      # Step 1 - Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 - Restore imported source IDs
      - name: Restore imported source IDs
        id: import_history
        uses: actions/cache/restore@v4
        with:
          path: .qazvinjobs-import-state/history.json
          key: qazvinjobs-import-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            qazvinjobs-import-history-v1-
          fail-on-cache-miss: false

      # Step 3 - Extract crawler package
      - name: Extract crawler package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Looking for QazvinJobs Crawler..."
          echo "========================================"

          ZIP_FILE="$(
            find . \
              -maxdepth 3 \
              -type f \
              -name "$QZIH_CRAWLER_PACKAGE" \
              -print |
            sort -V |
            tail -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No QazvinJobs Import Crawler ZIP found."
            echo ""
            echo "Expected package:"
            echo "$QZIH_CRAWLER_PACKAGE"
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Selected crawler package:"
          echo "$ZIP_FILE"

          RUNTIME_DIR="$GITHUB_WORKSPACE/.crawler-runtime"

          rm -rf "$RUNTIME_DIR"
          mkdir -p "$RUNTIME_DIR"

          unzip -q "$ZIP_FILE" -d "$RUNTIME_DIR"

          echo ""
          echo "Extracted files:"
          find "$RUNTIME_DIR" -maxdepth 5 -type f | sort

          echo ""
          echo "Looking for crawler.mjs..."

          CRAWLER_FILE="$(
            find "$RUNTIME_DIR" \
              -maxdepth 6 \
              -type f \
              -name 'crawler.mjs' |
            head -n 1
          )"

          if [ -z "$CRAWLER_FILE" ]; then
            echo "ERROR: crawler.mjs was not found."
            exit 1
          fi

          CRAWLER_DIR="$(dirname "$CRAWLER_FILE")"

          if [ ! -f "$CRAWLER_DIR/package.json" ]; then
            echo "ERROR: package.json was not found."
            ls -la "$CRAWLER_DIR"
            exit 1
          fi

          echo ""
          echo "Crawler directory detected:"
          echo "$CRAWLER_DIR"

          echo "CRAWLER_DIR=$CRAWLER_DIR" >> "$GITHUB_ENV"

      # Step 4 - Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 5 - Install crawler dependencies
      - name: Install crawler dependencies
        shell: bash
        run: |
          set -e

          cd "$CRAWLER_DIR"

          echo "Installing crawler dependencies..."

          npm install \
            --no-audit \
            --no-fund

      # Step 6 - Install Chromium
      - name: Install Chromium for Playwright
        shell: bash
        run: |
          set -e

          cd "$CRAWLER_DIR"

          npx playwright install --with-deps chromium

      # Step 7 - Validate settings
      - name: Validate required settings
        shell: bash
        run: |
          set -e

          echo "Checking Import Hub configuration..."

          if [ -z "$QZIH_IMPORT_ENDPOINT" ]; then
            echo "ERROR: QZIH_IMPORT_ENDPOINT is missing."
            exit 1
          fi

          if [ -z "$QZIH_IMPORT_TOKEN" ]; then
            echo "ERROR: QZIH_IMPORT_TOKEN is missing."
            exit 1
          fi

          if [ -z "$QZIH_SITE_URL" ]; then
            echo "WARNING: QZIH_SITE_URL is empty."
          else
            echo "Site URL: configured"
          fi

          echo "Import endpoint: configured"
          echo "Import token: configured"

          if [ -n "$QZIH_DIVAR_LOGIN_PHONE" ]; then
            echo "Divar login phone: configured"
          else
            echo "WARNING: Divar login phone is empty."
          fi

      # Step 8 - Show crawler version
      - name: Show crawler version
        shell: bash
        run: |
          set -e

          cd "$CRAWLER_DIR"

          echo "========================================"
          echo "Crawler package selected:"
          echo "$CRAWLER_DIR"
          echo "========================================"

          node -p '"Crawler version: " + JSON.parse(require("fs").readFileSync("package.json", "utf8")).version'

      # Step 9 - Test PHP Import Hub
      - name: Test Import Hub company and SEO handling
        shell: bash
        run: |
          set -euo pipefail

          cd "$CRAWLER_DIR"

          php -v

          find tests/php-importer \
            -type f \
            -name '*.php' \
            -print0 |
            xargs -0 -n1 php -l

          php tests/php-importer/tests/importer-regressions.php

      # Step 10 - Test crawler parser
      - name: Test parser before importing
        shell: bash
        run: |
          set -euo pipefail

          cd "$CRAWLER_DIR"

          npm test

      # Step 11 - Connect Divar manually
      - name: Connect Divar account (manual OTP, no import)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.connect_divar && !inputs.validate_only }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$CRAWLER_DIR"

          node divar-auth.mjs

      # Step 12 - Run crawler
      - name: Run QazvinJobs crawler
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.validate_only && !inputs.connect_divar) }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$CRAWLER_DIR"

          echo "========================================"
          echo "Starting QazvinJobs crawler"
          echo "Sources: E-Estekhdam + Divar"
          echo "Freshness: $QZIH_FRESHNESS_MODE"
          echo "Timezone: Asia/Tehran"
          echo "Direct contact required"
          echo "========================================"

          npm run crawl 2>&1 | tee run.log

      # Step 13 - Generate run summary
      - name: Explain zero-import result in GitHub Summary
        if: ${{ always() && env.CRAWLER_DIR != '' }}
        shell: bash
        run: |
          cd "$CRAWLER_DIR"

          if [ -f report-run.mjs ]; then
            node report-run.mjs run-summary.json
          else
            echo "Report module unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Step 14 - Save imported source IDs
      - name: Save imported source IDs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .qazvinjobs-import-state/history.json
          key: qazvinjobs-import-history-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # Step 15 - Upload run diagnostics
      - name: Upload crawl run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qazvinjobs-crawler-diagnostics-${{ github.run_id }}
          path: |
            .crawler-runtime/**/run.log
            .crawler-runtime/**/run-summary.json
          if-no-files-found: ignore
          retention-days: 7
