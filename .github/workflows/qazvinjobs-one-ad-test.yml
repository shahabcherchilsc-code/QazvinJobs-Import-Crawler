name: QazvinJobs One Ad Test
permissions:
  contents: read
  actions: read
'on':
  workflow_dispatch: null
concurrency:
  group: qazvinjobs-daily-crawler
  cancel-in-progress: false
jobs:
  crawl:
    name: One draft maximum - kkiw9f
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Tehran
      QZIH_SITE_URL: ${{ secrets.QZIH_SITE_URL }}
      QZIH_IMPORT_ENDPOINT: ${{ secrets.QZIH_IMPORT_ENDPOINT }}
      QZIH_IMPORT_TOKEN: ${{ secrets.QZIH_IMPORT_TOKEN }}
      QZIH_DIVAR_LOGIN_PHONE: ${{ secrets.QZIH_DIVAR_LOGIN_PHONE }}
      QZIH_SOURCES: e-estekhdam
      QZIH_DISCOVERY_ONLY: '0'
      QZIH_SEED_URLS: ''
      QZIH_MAX_PAGES: '1'
      QZIH_MAX_CANDIDATES: '1'
      QZIH_MAX_ACCEPT: '1'
      QZIH_MAX_REVIEW: '5'
      QZIH_RUN_LIMIT_MINUTES: '4'
      QZIH_MAX_AGE_DAYS: '1'
      QZIH_FRESHNESS_MODE: today_yesterday
      QZIH_IMPORT_HISTORY_FILE: ${{ github.workspace }}/.qazvinjobs-import-state/history.json
      QZIH_REQUIRE_KNOWN_AGE: '1'
      QZIH_ALLOW_CONTACT_REVIEW: '0'
      QZIH_ENABLE_CONTROLLED_TEST: '0'
      QZIH_CRAWLER_PACKAGE: QazvinJobs-Import-Crawler-0.6.15-LISTING-BADGE.zip
      QZIH_EESTEKHDAM_PREFER_NEWEST: '0'
      QZIH_DISCOVERY_PROBE_IDS: kkiw9f
      QZIH_EESTEKHDAM_SEARCH_URL: https://www.e-estekhdam.com/jobs/%D8%A7%D8%B3%D8%AA%D8%AE%D8%AF%D8%A7%D9%85-%D8%AF%D8%B1-%D9%82%D8%B2%D9%88%DB%8C%D9%86-%D8%A8%D8%B1%D8%A7%DB%8C-%DA%A9%D8%A7%D8%B1%D8%B4%D9%86%D8%A7%D8%B3-%D8%B1%D9%88%D8%A7%D9%86%D8%B4%D9%86%D8%A7%D8%B3%DB%8C
    steps:
    - name: Daily execution guard
      id: daily_guard
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        python3 - <<'PY_QJ_GUARD'
        """Check actual prior job steps, including reruns, before a daily operation."""
        import datetime as dt
        import json
        import os
        import re
        import urllib.parse
        import urllib.request
        from pathlib import Path
        from zoneinfo import ZoneInfo

        IRAN = ZoneInfo('Asia/Tehran')
        JOB = 'Crawl E-Estekhdam + Divar'
        MAIN_STEP = 'Run QazvinJobs crawler'
        TEST_STEP = 'Test parser before importing'

        def truth(value):
            return value is True or str(value).lower() == 'true'

        def github_get(path):
            token = os.environ.get('GH_TOKEN', '')
            if not token:
                raise RuntimeError('GitHub Actions read token is missing; daily operation blocked.')
            request = urllib.request.Request('https://api.github.com' + path, headers={
                'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2026-03-10', 'User-Agent': 'QazvinJobs-Daily-Guard/1.0',
            })
            try:
                with urllib.request.urlopen(request, timeout=15) as response:
                    return json.load(response)
            except Exception:
                raise RuntimeError('GitHub history could not be verified; daily operation blocked.') from None

        def paged(get, path, key, maximum=3):
            rows = []
            separator = '&' if '?' in path else '?'
            for page in range(1, maximum + 1):
                data = get(path + separator + urllib.parse.urlencode({'per_page': 100, 'page': page}))
                part = data.get(key)
                if not isinstance(part, list):
                    raise RuntimeError('Invalid GitHub history response; daily operation blocked.')
                rows.extend(part)
                if len(part) < 100:
                    return rows
            raise RuntimeError('GitHub history exceeded the verification limit; daily operation blocked.')

        def decide(event, env, get=github_get, now=None):
            inputs = event.get('inputs') or {}
            if truth(inputs.get('audit_only')) and any(truth(inputs.get(k)) for k in ('validate_only', 'connect_divar', 'discovery_only')):
                raise RuntimeError('Choose only one test mode for a source audit.')
            if not truth(inputs.get('automatic_daily')):
                return {'allow': True, 'reason': 'manual', 'mode': 'manual'}
            now = (now or dt.datetime.now(IRAN)).astimezone(IRAN)
            day = str(inputs.get('scheduled_day') or '')
            mode = 'validation' if truth(inputs.get('validate_only')) else 'import'
            base = {'mode': mode, 'day': day}
            if day != now.date().isoformat():
                return dict(base, allow=False, reason='stale_or_invalid_day')
            if (truth(inputs.get('connect_divar')) or truth(inputs.get('discovery_only')) or truth(inputs.get('audit_only'))
                    or str(inputs.get('source_url') or '').strip()
                    or str(inputs.get('source') or 'both') != 'both'):
                return dict(base, allow=False, reason='unexpected_automatic_inputs')
            repo = env.get('GITHUB_REPOSITORY', '')
            if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
                raise RuntimeError('Invalid repository metadata; daily operation blocked.')
            current_id = str(env.get('GITHUB_RUN_ID', ''))
            title = f'QazvinJobs Daily Import [{day}] [{mode}]'
            midnight = now.replace(hour=0, minute=0, second=0, microsecond=0).astimezone(dt.timezone.utc)
            query = urllib.parse.urlencode({'event': 'workflow_dispatch', 'branch': 'main',
                                          'created': '>=' + midnight.isoformat().replace('+00:00', 'Z')})
            root = '/repos/' + repo + '/actions'
            runs = paged(get, root + '/workflows/qazvinjobs-import.yml/runs?' + query, 'workflow_runs')
            failures = 0
            for run in runs:
                if run.get('display_title') != title:
                    continue
                run_id = str(run.get('id', ''))
                if not run_id.isdigit():
                    raise RuntimeError('Invalid run identity; daily operation blocked.')
                # filter=all is essential: a skipped rerun must not hide a prior success.
                jobs = paged(get, root + '/runs/' + run_id + '/jobs?filter=all', 'jobs', maximum=2)
                for job in jobs:
                    if job.get('name') != JOB:
                        continue
                    complete = job.get('status') == 'completed'
                    if run_id == current_id and not complete:
                        continue  # Our own running guard; previous completed attempts still count.
                    steps = {s.get('name'): s.get('conclusion') for s in job.get('steps', [])}
                    expected_step = TEST_STEP if mode == 'validation' else MAIN_STEP
                    if complete and steps.get(expected_step) == 'success':
                        return dict(base, allow=False, reason='already_completed', prior_run=run.get('html_url', ''))
                    if job.get('status') == 'in_progress':
                        return dict(base, allow=False, reason='already_running', prior_run=run.get('html_url', ''))
                    if (complete and job.get('conclusion') in ('failure', 'timed_out', 'cancelled')
                            and steps.get('Daily execution guard') == 'success'):
                        failures += 1
            if failures >= 2:
                return dict(base, allow=False, reason='daily_attempt_limit', failures=failures)
            return dict(base, allow=True, reason='daily_attempt_allowed', attempt=failures + 1)

        def main():
            event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
            decision = decide(event, os.environ)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                output.write('should_run=' + ('true' if decision['allow'] else 'false') + '\n')
            now = dt.datetime.now(IRAN)
            lines = ['## Daily execution guard', '', f"Decision: {decision['reason']}",
                     f"Mode: {decision['mode']}", 'Iran runner clock: ' + now.isoformat(),
                     'Workflow revision: ' + os.environ.get('GITHUB_SHA', '')]
            if decision.get('prior_run'):
                lines.append('Prior run: ' + decision['prior_run'])
            summary = '\n'.join(lines) + '\n'
            print(summary)
            if os.environ.get('GITHUB_STEP_SUMMARY'):
                with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
                    target.write(summary)

        if __name__ == '__main__':
            main()

        PY_QJ_GUARD
    - name: Checkout repository
      uses: actions/checkout@v4
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
    - name: Restore imported source IDs
      id: import_history
      uses: actions/cache/restore@v4
      with:
        path: .qazvinjobs-import-state/history.json
        key: qazvinjobs-import-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          qazvinjobs-import-history-v1-
        fail-on-cache-miss: false
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
    - name: Extract crawler package
      shell: bash
      run: |
        set -e

        echo "========================================"
        echo "Looking for latest QazvinJobs Crawler..."
        echo "========================================"

        ZIP_FILE="$(
          find . \
            -maxdepth 3 \
            -type f \
            -name "$QZIH_CRAWLER_PACKAGE" \
            -print |
          sort -V |
          tail -n 1
        )"

        if [ -z "$ZIP_FILE" ]; then
          echo "ERROR: No QazvinJobs Import Crawler ZIP found."
          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort
          exit 1
        fi

        echo "Selected crawler package:"
        echo "$ZIP_FILE"

        RUNTIME_DIR="$GITHUB_WORKSPACE/.crawler-runtime"

        rm -rf "$RUNTIME_DIR"
        mkdir -p "$RUNTIME_DIR"

        unzip -q "$ZIP_FILE" -d "$RUNTIME_DIR"

        echo ""
        echo "Extracted files:"
        find "$RUNTIME_DIR" -maxdepth 5 -type f | sort

        echo ""
        echo "Looking for crawler.mjs..."

        CRAWLER_FILE="$(
          find "$RUNTIME_DIR" \
            -maxdepth 6 \
            -type f \
            -name 'crawler.mjs' |
          head -n 1
        )"

        if [ -z "$CRAWLER_FILE" ]; then
          echo "ERROR: crawler.mjs was not found after extracting ZIP."
          exit 1
        fi

        CRAWLER_DIR="$(dirname "$CRAWLER_FILE")"

        if [ ! -f "$CRAWLER_DIR/package.json" ]; then
          echo "ERROR: package.json was not found beside crawler.mjs."
          echo ""
          echo "Crawler directory:"
          echo "$CRAWLER_DIR"
          echo ""
          ls -la "$CRAWLER_DIR"
          exit 1
        fi

        echo ""
        echo "Crawler directory detected:"
        echo "$CRAWLER_DIR"

        echo "CRAWLER_DIR=$CRAWLER_DIR" >> "$GITHUB_ENV"
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
    - name: Install crawler dependencies
      shell: bash
      run: |
        set -e

        cd "$CRAWLER_DIR"

        echo "Installing crawler dependencies..."

        npm install \
          --no-audit \
          --no-fund
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
    - name: Install Chromium for Playwright
      shell: bash
      run: |
        set -e

        cd "$CRAWLER_DIR"

        npx playwright install --with-deps chromium
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
    - name: Validate required settings
      shell: bash
      run: |
        set -e

        echo "Checking Import Hub configuration..."

        if [ -z "$QZIH_IMPORT_ENDPOINT" ]; then
          echo "ERROR: QZIH_IMPORT_ENDPOINT is missing."
          exit 1
        fi

        if [ -z "$QZIH_IMPORT_TOKEN" ]; then
          echo "ERROR: QZIH_IMPORT_TOKEN is missing."
          exit 1
        fi

        if [ -z "$QZIH_SITE_URL" ]; then
          echo "WARNING: QZIH_SITE_URL is empty."
        else
          echo "Site URL: configured"
        fi

        echo "Import endpoint: configured"
        echo "Import token: configured"

        if [ -n "$QZIH_DIVAR_LOGIN_PHONE" ]; then
          echo "Divar login phone: configured"
        else
          echo "WARNING: QZIH_DIVAR_LOGIN_PHONE is empty."
        fi
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
    - name: Limit discovery to the selected ad
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - "$CRAWLER_DIR/crawler.mjs" <<'PY'
        from pathlib import Path
        import sys
        path = Path(sys.argv[1])
        source = path.read_text()
        needle = '        const cleaned = cleanUrl(row.href);'
        if source.count(needle) != 1:
            raise RuntimeError('Unexpected crawler layout; test stopped before importing')
        limit = "\n        if (source !== 'e-estekhdam' || sourceId(cleaned, source) !== 'kkiw9f') continue;"
        path.write_text(source.replace(needle, needle + limit, 1))
        print('Discovery limited to kkiw9f. Date, listing badge, contact and duplicate gates remain enabled.')
        PY
    - name: Show crawler version
      shell: bash
      run: |
        set -e

        cd "$CRAWLER_DIR"

        echo "========================================"
        echo "Crawler package selected:"
        echo "$CRAWLER_DIR"
        echo "========================================"

        node -p '"Crawler version: " + JSON.parse(require("fs").readFileSync("package.json", "utf8")).version'
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
    - name: Test Import Hub company and SEO handling
      shell: bash
      run: |
        set -euo pipefail
        cd "$CRAWLER_DIR"
        php -v
        find tests/php-importer -type f -name '*.php' -print0 | xargs -0 -n1 php -l
        php tests/php-importer/tests/importer-regressions.php

        php tests/php-importer/tests/identity-regressions.php

        php tests/php-importer/tests/eestekhdam-policy-regressions.php
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
    - name: Test parser before importing
      shell: bash
      run: |
        set -euo pipefail
        cd "$CRAWLER_DIR"
        npm test
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
    - name: Check installed receiver policy (GET only)
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        """GET-only receiver readiness check; only allowlisted diagnostics leave memory."""
        import json
        import os
        import re
        import socket
        import ssl
        import urllib.error
        import urllib.parse
        import urllib.request

        LIMIT = 65536
        WP_CODES = {'rest_forbidden', 'rest_no_route', 'rest_cannot_access', 'rest_not_logged_in', 'rest_invalid_param', 'rest_cookie_invalid_nonce', 'internal_server_error'}


        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, fp, code, msg, headers, newurl):
                return None  # HTTPError is classified without forwarding the token.


        def classify(status, headers, body):
            content_type = str(headers.get('Content-Type', '')).split(';')[0].lower().strip()
            kind = 'json' if content_type == 'application/json' or content_type.endswith('+json') else 'html' if content_type in ('text/html', 'application/xhtml+xml') else 'other'
            result = {'http_status': status, 'response_type': kind, 'result': 'unverified', 'ready': False}
            if len(body) > LIMIT:
                result['result'] = 'response_too_large'
                return result
            try:
                data = json.loads(body)
            except (ValueError, UnicodeError):
                data = None
            if isinstance(data, dict):
                result['response_type'] = 'json'
                if data.get('code') in WP_CODES:
                    result['wordpress_code'] = data['code']
            if status in (401, 403):
                result['result'] = 'authentication_denied' if isinstance(data, dict) and data.get('code') in WP_CODES else 'access_denied'
            elif status == 404:
                result['result'] = 'route_not_found'
            elif status == 429:
                result['result'] = 'rate_limited'
            elif status >= 500:
                result['result'] = 'server_error'
            elif status != 200:
                result['result'] = 'unexpected_http_status'
            elif not isinstance(data, dict):
                result['result'] = 'html_instead_of_json' if kind == 'html' else 'invalid_json_response'
            else:
                version = data.get('version')
                if isinstance(version, str) and re.fullmatch(r'\d+(?:\.\d+){1,4}', version):
                    result['receiver_version'] = version
                result['guard_present'] = data.get('identity_guard') == 'page-lock-v1'
                result['lock_ready'] = data.get('identity_lock_ready') is True
                if data.get('ok') is not True:
                    result['result'] = 'unexpected_json_response'
                elif version != '0.3.60':
                    result['result'] = 'receiver_version_mismatch'
                elif not result['guard_present']:
                    result['result'] = 'identity_guard_missing'
                elif not result['lock_ready']:
                    result['result'] = 'database_lock_not_ready'
                elif data.get('eestekhdam_application_policy') != 'listing-card-v1':
                    result['result'] = 'application_policy_missing'
                else:
                    result.update(result='verified', ready=True)
            return result


        def check(endpoint, token, open_request=None):
            endpoint = str(endpoint or '').strip().rstrip('/')
            token = str(token or '').strip()
            parsed = urllib.parse.urlparse(endpoint)
            if (parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.port
                    or parsed.query or parsed.fragment or not parsed.path.endswith('/wp-json/qazvinjobs-import/v1/batch') or not token):
                return {'result': 'configuration_incomplete', 'ready': False}
            status_url = endpoint[:-6] + '/status'
            request = urllib.request.Request(status_url, method='GET', headers={
                'X-Qzih-Token': token,
                'Authorization': 'Bearer ' + token,
                'Accept': 'application/json',
                'Cache-Control': 'no-cache',
                'User-Agent': 'QazvinJobsImportCrawler/0.6.10',
            })
            opener = open_request or urllib.request.build_opener(NoRedirect).open
            try:
                with opener(request, timeout=20) as response:
                    return classify(response.status, response.headers, response.read(LIMIT + 1))
            except urllib.error.HTTPError as error:
                if 300 <= error.code < 400:
                    location = urllib.parse.urlparse(urllib.parse.urljoin(status_url, error.headers.get('Location', '')))
                    result = {'result': 'redirect_refused', 'http_status': error.code, 'ready': False,
                              'redirect_same_origin': (location.scheme, location.netloc) == (parsed.scheme, parsed.netloc)}
                    error.close()
                    return result
                try:
                    return classify(error.code, error.headers, error.read(LIMIT + 1))
                finally:
                    error.close()
            except (TimeoutError, socket.timeout):
                return {'result': 'connection_timeout', 'ready': False}
            except urllib.error.URLError as error:
                reason = error.reason
                kind = 'tls_verification_failed' if isinstance(reason, ssl.SSLCertVerificationError) else 'dns_failed' if isinstance(reason, socket.gaierror) else 'connection_timeout' if isinstance(reason, TimeoutError) else 'connection_failed'
                return {'result': kind, 'ready': False}
            except Exception:
                # Do not print raw exceptions: they can include endpoints or credentials.
                return {'result': 'connection_or_response_failed', 'ready': False}


        def main():
            try:
                result = check(os.environ.get('QZIH_IMPORT_ENDPOINT'), os.environ.get('QZIH_IMPORT_TOKEN'))
            except Exception:
                result = {'result': 'invalid_configuration', 'ready': False}
            print('Receiver connection diagnostic (GET only; no import requested):')
            print(json.dumps(result, ensure_ascii=True, indent=2))
            summary = os.environ.get('GITHUB_STEP_SUMMARY')
            if summary:
                with open(summary, 'a', encoding='utf-8') as file:
                    file.write('## Receiver connection — no imports\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
            if not result['ready']:
                print('::error title=Receiver connection::' + result['result'] + '; HTTP=' + str(result.get('http_status', 'not_received')) + '; no import requested.')
                return 1
            print('Receiver 0.3.60 and host database lock verified; no draft imported.')
            return 0


        if __name__ == '__main__':
            raise SystemExit(main())

        PY
    - name: Run QazvinJobs crawler
      if: ${{ steps.daily_guard.outputs.should_run == 'true' }}
      shell: bash
      run: |
        set -e

        cd "$CRAWLER_DIR"

        echo "========================================"
        echo "Starting QazvinJobs crawler"
        echo "Source: E-Estekhdam; selected ID: kkiw9f"
        echo "Freshness: $QZIH_FRESHNESS_MODE (Iran timezone); direct contact required"
        echo "========================================"

        set -o pipefail
        npm run crawl 2>&1 | tee run.log
      timeout-minutes: 8
    - name: Explain zero-import result in GitHub Summary
      if: ${{ always() && steps.daily_guard.outputs.should_run == 'true' && (env.CRAWLER_DIR != '') }}
      shell: bash
      run: |
        cd "$CRAWLER_DIR"
        node report-run.mjs run-summary.json
    - name: Save imported source IDs
      if: ${{ always() && steps.daily_guard.outputs.should_run == 'true' && (true) }}
      uses: actions/cache/save@v4
      with:
        path: .qazvinjobs-import-state/history.json
        key: qazvinjobs-import-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Prepare counters-only crawl report
      if: ${{ always() && steps.daily_guard.outputs.should_run == 'true' && env.CRAWLER_DIR != '' }}
      shell: bash
      run: |
        python3 - "$CRAWLER_DIR/run-summary.json" <<'PY_QJ_REPORT'
        """Export counters only; never upload raw pages, contacts, endpoints or logs."""
        import json
        import re
        import sys
        from pathlib import Path
        source = Path(sys.argv[1])
        if not source.is_file():
            print('No crawl report for this validation or skipped run.')
            raise SystemExit(0)
        data = json.loads(source.read_text())
        result = {}
        for key in ('crawler_version', 'source_mode', 'discovery_only', 'audit_only', 'duration_seconds',
                    'direct_accepted', 'review_queued', 'contact_review_accepted', 'total_sent'):
            value = data.get(key)
            if isinstance(value, (bool, int, float)) or (isinstance(value, str) and re.fullmatch(r'[A-Za-z0-9_.-]{1,50}', value)):
                result[key] = value
        result['limits'] = {k: v for k, v in data.get('limits', {}).items()
                                    if k in ('max_accept', 'max_age_days', 'freshness_mode', 'require_known_age', 'allow_contact_review', 'requested_max_pages', 'requested_max_candidates')
                            and (isinstance(v, (bool, int, float)) or v in ('rolling', 'today_yesterday'))}
        counters = ('discovered', 'urls_discovered', 'pages_scanned', 'inspected', 'accepted',
                    'too_old', 'unknown_age', 'previously_imported', 'duplicates', 'no_contact',
                    'no_location', 'errors', 'fresh_discovered', 'discovery_sort_verified',
                    'auth_loaded', 'identity_mismatch', 'duplicate_in_run', 'login_required',
                    'search_http_status', 'public_read_posts_allowed', 'posts_blocked',
                    'detail_wait_retries', 'detail_wait_ms', 'detail_ready_without_date',
                    'detail_load_failures', 'easy_apply_skipped', 'application_unknown', 'contact_review_drafts', 'auth_required_skipped', 'non_job_category', 'contact_reveal_failed')
        result['sources'] = {}
        for name in ('e-estekhdam', 'divar'):
            row = data.get('sources', {}).get(name, {})
            safe = {key: row[key] for key in counters if isinstance(row.get(key), (bool, int, float))}
            for key in ('discovery_sort_status', 'auth_status', 'search_stage', 'search_status', 'search_error'):
                value = row.get(key)
                if isinstance(value, str) and re.fullmatch(r'[A-Za-z_]{1,80}', value):
                    safe[key] = value
            result['sources'][name] = safe
        out = Path('qazvinjobs-run-report')
        out.mkdir(exist_ok=True)
        (out / 'run-summary.json').write_text(json.dumps(result, ensure_ascii=False, indent=2))
        print('Saved counters-only run report.')

        if isinstance(data.get('freshness_samples'), list):
            import math
            rows = []
            for row in data['freshness_samples'][:16]:
                source_name = row.get('source')
                source_id = row.get('source_id', '')
                if source_name not in ('e-estekhdam', 'divar') or not isinstance(source_id, str) or not re.fullmatch(r'(?:k[a-z0-9]+|divar-[a-z0-9_-]{5,})', source_id):
                    continue
                safe = {'source': source_name, 'source_id': source_id}
                date = row.get('published_at', '')
                if isinstance(date, str) and re.fullmatch(r'[0-9T:.Z+ /-]{0,60}', date):
                    safe['published_at'] = date
                for key in ('reason', 'readiness'):
                    value = row.get(key)
                    if value in ('old', 'unknown', 'recent', 'ready_with_date', 'ready_without_date'):
                        safe[key] = value
                for key in ('age_days', 'relative_age_days', 'wait_ms'):
                    value = row.get(key)
                    if isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(value):
                        safe[key] = value
                rows.append(safe)
            (out / 'freshness-samples.json').write_text(json.dumps({'samples': rows}, ensure_ascii=False, indent=2))

        # Only the read-only auditor writes these fields. Rebuild the downloadable
        # report from an explicit schema; never upload raw DOM, logs or contacts.
        if data.get('audit_only') is True:
            import urllib.parse
            import math
            def number(value):
                return value if isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(value) else None
            def redact(value):
                value = str(value or '').translate(str.maketrans('۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩', '01234567890123456789'))
                value = re.sub(r'https?://\S+|[\w.+-]+@[\w.-]+\.[a-z]{2,}|@[\w.-]+', '[redacted]', value, flags=re.I)
                value = re.sub(r'(?:\+?\d[\s().-]*){8,}', '[redacted]', value)
                return re.sub(r'\s+', ' ', value).strip()[:180]
            safe_rows = []
            for row in data.get('records', [])[:8]:
                name, sid = row.get('source'), row.get('source_id', '')
                if name == 'e-estekhdam' and re.fullmatch(r'k[a-z0-9]+', sid):
                    url = 'https://www.e-estekhdam.com/' + sid
                elif name == 'divar' and re.fullmatch(r'divar-[a-z0-9_-]{5,}', sid):
                    parsed = urllib.parse.urlparse(row.get('source_url', ''))
                    if parsed.scheme != 'https' or parsed.netloc != 'divar.ir' or not re.fullmatch(r'/v/[A-Za-z0-9_-]{5,}', parsed.path):
                        continue
                    url = 'https://divar.ir' + parsed.path
                else:
                    continue
                safe = {'source': name, 'source_id': sid, 'source_url': url}
                for key in ('status', 'warning', 'relative_evidence_kind'):
                    value = row.get(key)
                    if isinstance(value, str) and re.fullmatch(r'[a-z_]{0,50}', value):
                        safe[key] = value
                value = row.get('published_at', '')
                if isinstance(value, str) and re.fullmatch(r'\d{4}-\d{2}-\d{2}T[0-9:.]+Z|', value):
                    safe['published_at'] = value
                safe['relative_evidence'] = redact(row.get('relative_evidence', ''))
                for key in ('page_id_acknowledged', 'detail_date_present'):
                    if isinstance(row.get(key), bool):
                        safe[key] = row[key]
                for key in ('acknowledged_position_ids', 'card_age_days'):
                    safe[key] = number(row.get(key))
                verdict = row.get('decision', {})
                if verdict.get('reason') in ('recent', 'old', 'unknown') and isinstance(verdict.get('allow'), bool):
                    safe['decision'] = {'reason': verdict['reason'], 'allow': verdict['allow'],
                                        'age_days': number(verdict.get('age_days')),
                                        'day_difference': number(verdict.get('day_difference'))}
                safe_rows.append(safe)
            (out / 'audit-report.json').write_text(json.dumps({'audit_only': True, 'total_sent': 0, 'records': safe_rows}, ensure_ascii=False, indent=2))

        # Only bounded public IDs, flags and fixed reason codes; no contact values.
        trace = {}
        for key in ('application_samples', 'contact_samples'):
            rows = []
            for row in data.get(key, [])[:24]:
                sid = row.get('source_id', '')
                if not isinstance(sid, str) or not re.fullmatch(r'(?:k[a-z0-9]+|divar-[a-z0-9_-]{5,})', sid):
                    continue
                safe = {'source_id': sid}
                for name in ('source', 'state', 'application_state', 'detection_reason'):
                    value = row.get(name)
                    allowed = {'source': ('e-estekhdam', 'divar'), 'state': ('easy_apply', 'eligible', 'unknown'), 'application_state': ('easy_apply', 'eligible', 'unknown', 'not_applicable'), 'detection_reason': ('no_visible_numbered_contact_block', 'visible_numbered_contact_block', 'contact_block_without_number', 'reveal_clicked_but_no_number', 'revealed_numbered_contact_block', 'not_reported')}
                    if value in allowed[name]:
                        safe[name] = value
                for name in ('card_complete', 'easy_apply', 'direct_contact', 'review_required', 'clicked', 'contact_available'):
                    if isinstance(row.get(name), bool):
                        safe[name] = row[name]
                value = row.get('network_responses')
                if isinstance(value, int) and not isinstance(value, bool) and 0 <= value <= 1000:
                    safe['network_responses'] = value
                rows.append(safe)
            trace[key] = rows
        if any(trace.values()):
            (out / 'application-contact-samples.json').write_text(json.dumps(trace, ensure_ascii=False, indent=2))

        PY_QJ_REPORT
    - name: Upload crawl run report
      if: ${{ always() && steps.daily_guard.outputs.should_run == 'true' && (true) }}
      uses: actions/upload-artifact@v4
      with:
        name: qazvinjobs-crawler-diagnostics-${{ github.run_id }}
        path: qazvinjobs-run-report/*.json
        if-no-files-found: ignore
        retention-days: 7
